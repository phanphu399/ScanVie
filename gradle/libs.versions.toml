[versions]
agp = "8.7.3"
kotlin = "2.1.0"
ksp = "2.1.0-1.0.29"
composeBom = "2024.12.01"
coreKtx = "1.15.0"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
navigation = "2.8.5"
room = "2.6.1"
datastore = "1.1.1"
hilt = "2.53.1"
hiltNavigationCompose = "1.2.0"
coroutines = "1.9.0"
junit4 = "4.13.2"
robolectric = "4.14.1"
turbine = "1.2.0"
androidxTestCore = "1.6.1"
# `org.json` có sẵn trong Android nhưng KHÔNG có trên JVM, nên test đọc JSON của
# GitHubReleaseSource cần bản này. Chỉ dùng cho test, không vào APK.
json = "20240303"
# ML Kit Document Scanner: giao diện quét + xử lý ảnh do Play services cung cấp.
# Đã ở bản stable kể từ 16.0.0 (29/09/2025).
mlkitDocumentScanner = "16.0.0"
# ML Kit Text Recognition v2, bản BUNDLED (model gắn sẵn vào APK).
# Vì sao chọn bản bundled thay vì play-services-mlkit-text-recognition: bản bundled
# chạy được ngoại tuyến NGAY sau khi cài, không phải chờ Play services tải model về.
# Điều này khớp với lời hứa "nhận dạng trên thiết bị" của ứng dụng. Đổi lại APK tăng
# khoảng 4 MB — cái giá hợp lý cho một tính năng lõi không phụ thuộc mạng.
#
# HẠN CHẾ QUAN TRỌNG (đã kiểm chứng bằng tài liệu Google tháng 10/2026):
# API này chỉ hỗ trợ 5 hệ chữ: Latin, Chinese, Devanagari, Japanese, Korean.
# TIẾNG VIỆT CÓ DẤU KHÔNG NẰM TRONG DANH SÁCH ĐƯỢC HỖ TRỢ CHÍNH THỨC. Model Latin
# đóng gói là `Latn_ctc` (xem assets/mlkit-google-ocr-models trong APK) và nó bỏ dấu
# hoặc trả về chuỗi rỗng với văn bản tiếng Việt.
#
# Từ Giai đoạn B, engine này KHÔNG còn là mặc định — nó chỉ còn là lựa chọn dự phòng
# cho tài liệu tiếng Anh (nơi nó mạnh hơn Tesseract nhờ mô hình nơ-ron). Engine mặc
# định cho tiếng Việt là Tesseract; xem `ocrEngineKind` bên dưới.
mlkitTextRecognition = "16.0.1"

# ---------------------------------------------------------------------------
# Tesseract 5 cho Android (Giai đoạn B) — engine nhận dạng chữ TIẾNG VIỆT.
#
# Vì sao cần: ML Kit Text Recognition v2 không có tiếng Việt trong 5 hệ chữ được hỗ
# trợ, nên chữ có dấu bị bỏ dấu hoặc mất hẳn. Tesseract có `vie.traineddata` chính
# thức do dự án Tesseract phát hành, giữ được dấu tiếng Việt.
#
# ĐÃ KIỂM CHỨNG THẬT NGÀY 20/10/2026 (không suy đoán):
#   - `cz.adaptech.tesseract4android:tesseract4android:4.9.0` -> HTTP 200, AAR 12,25 MB
#   - Artifact này nằm trên **JitPack**, KHÔNG có trên Maven Central.
#     (Đã kiểm chứng: `search.maven.org` cho `g:cz.adaptech` ra 0 kết quả, và
#      `repo1.maven.org/maven2/cz/adaptech/` trả 404.)
#   - Giấy phép: Apache 2.0. Bao gồm Tesseract 5.5.1 + Leptonica 1.85.0.
#   - Yêu cầu: Android 5.0 (API 21)+. Ứng dụng này minSdk 23 nên thoả.
#
# Vì sao bản "standard" (đơn luồng) chứ không phải "openmp": luồng nhận dạng của ứng
# dụng xử lý TUẦN TỰ từng trang và chỉ dùng MỘT instance Tesseract. Bản openmp tăng
# tốc khi chạy một instance, nhưng thêm phụ thuộc native của OpenMP và làm APK to
# hơn. Với 20 trang/lần quét, chênh lệch không đáng để đánh đổi thêm rủi ro đóng gói.
tesseract4android = "4.9.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Trình quét tài liệu của ML Kit. KHÔNG kèm model OCR; model quét do Play services
# tải ở lần dùng đầu tiên (đây là lý do tuyên bố "hoạt động ngoại tuyến" phải nói rõ).
mlkit-document-scanner = { module = "com.google.android.gms:play-services-mlkit-document-scanner", version.ref = "mlkitDocumentScanner" }

# Nhận dạng chữ (OCR) hệ chữ Latin — chỉ còn dùng cho tiếng Anh.
# Xem `mlkitTextRecognition` ở [versions]: KHÔNG hỗ trợ tiếng Việt có dấu.
mlkit-text-recognition = { module = "com.google.mlkit:text-recognition", version.ref = "mlkitTextRecognition" }

# Tesseract 5 + Leptonica cho Android. Engine nhận dạng chữ tiếng Việt.
# Lưu ý: PHẢI có repository JitPack trong settings.gradle.kts, artifact này không
# nằm trên Maven Central (đã kiểm chứng 404 ngày 20/10/2026).
tesseract4android = { module = "cz.adaptech.tesseract4android:tesseract4android", version.ref = "tesseract4android" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

junit = { module = "junit:junit", version.ref = "junit4" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
androidx-test-core-ktx = { module = "androidx.test:core-ktx", version.ref = "androidxTestCore" }
json = { module = "org.json:json", version.ref = "json" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
room = { id = "androidx.room", version.ref = "room" }
